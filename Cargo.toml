[workspace]
resolver = "3"
members = ["crates/adapter","crates/api", "crates/healing","crates/ledger"]

[workspace.dependencies]
tokio = {version = "^1.53.3", features = ["full"]}
axum = {version = "^0.8.9"}
uuid = { version = "1.28.0", features = ["v4"] }
serde_json = { version = "^1.0.154" }
sha2 = { version = "^0.11.1" }

sqlx = {version = "0.9.0", features = ["runtime-tokio", "postgres"]}
serde = {version = "^1.0.229", features = ["derive", "default"]}
