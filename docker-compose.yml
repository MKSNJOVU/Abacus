services:
  services:
    postgres:
      image: postgres:16
      environment:
        POSTGRES_DB: payment_engine
        POSTGRES_PASSWORD: dev
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data

    api:
      build:
        context: .
        dockerfile: docker/api.Dockerfile
      ports:
        - "3000:3000"
      environment:
        DATABASE_URL: postgres://postgres:dev@postgres:5432/payment_engine
      depends_on:
        - postgres

    reconciliation:
      build:
        context: .
        dockerfile: docker/reconciliation.Dockerfile
      environment:
        DATABASE_URL: postgres://postgres:dev@postgres:5432/payment_engine
        API_URL: http://api:3000
      depends_on:
        - postgres
        - api

    grafana:
      image: grafana/grafana:latest
      ports:
        - "3001:3000"
      volumes:
        - ./docker/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/default.json

  volumes:
    pgdata: