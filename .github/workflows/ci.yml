name: CI
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # This will check your code formatting. We must fix the code locally before pushing.
      - run: cargo fmt --check
      # Clippy acts as a strict linter to catch common Rust mistakes.
      - run: cargo clippy --workspace -- -D warnings
      # Runs your inline unit tests.
      - run: cargo test --workspace

