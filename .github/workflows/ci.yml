name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Abacus.slnx

      - name: Check formatting
        run: dotnet format Abacus.slnx --verify-no-changes --no-restore

      - name: Build (warnings fail the build)
        run: dotnet build Abacus.slnx --no-restore -warnaserror

      - name: Test
        run: dotnet test Abacus.slnx --no-build